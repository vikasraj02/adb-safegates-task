name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: hello-python:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name t -p 8080:8080 hello-python:${{ github.sha }}
          for i in $(seq 1 10); do curl -fs localhost:8080/healthz && break || sleep 1; done
          curl -fs localhost:8080/ | grep -q "Hello, World"
          docker rm -f t

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hello-python:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy to local kind cluster
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Self-hosted runner on the workstation that hosts the kind cluster
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build, load into kind, roll out
        run: ./scripts/deploy.sh ${{ github.sha }}
